name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # D-09: node-version 20 -> 22 aus zwei getrennten Gruenden. (1) Node 20 ist
      # End-of-Life (siehe 11-RESEARCH.md); Node 22 ist Maintenance-LTS bis
      # 2027-04, die konservativere Wahl gegenueber Node 24 fuer eine
      # Deploy-Kette. (2) Dies behebt NICHT die "Node.js 20 actions are
      # deprecated"-Job-Annotation — die stammt aus der Node-Runtime, mit der
      # der Runner den JS-Code der Actions selbst ausfuehrt (`runs.using` in
      # der jeweiligen action.yml), unabhaengig vom node-version-Input hier.
      # Dafuer sind die Action-Major-Bumps unten zustaendig.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: npm ci
      - run: npm test
      - run: pip install -r requirements-dev.txt
      - run: python build.py
      - run: python -m pytest tests/build/ -v

  # Phase 8 (D-03): voller Playwright-E2E-Lauf gegen den DEV-Bundle (file://,
  # kein HTTP-Server, kein SMOKE_BASE_URL — das ist der bereits vorhandene
  # smoke-test-Job gegen den PRODUCTION-Bundle, ein anderer Check). Bewusst
  # OHNE die YAML-Option, die einen roten Schritt ignorieren wuerde: ein roter
  # e2e-Lauf muss den Merge/Deploy blockieren. Das Erzwingen dieses Checks vor
  # dem Merge ist eine GitHub-Branch-Protection-Einstellung (Repo-Settings),
  # die dieses ci.yml nicht setzen kann.
  e2e:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: npm ci
      - run: python build.py
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            tests/e2e/reports/
            tests/e2e/test-results/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test, e2e]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: npm ci
      - run: python build.py --production
      - name: Bereite vollstaendiges Artefakt vor
        # build.py erzeugt nur dnd-tracker-optimized.html und sw.js. Manifest,
        # Icons und Fonts kommen aus dem Repo dazu — dieselben Schritte wie im
        # deploy-Job, damit smoke-test genau das prueft, was veroeffentlicht wird.
        # Ohne das fehlt sw.js im Artefakt (404) und der SW-Precache von
        # ./manifest.webmanifest liesse cache.addAll() scheitern (CR-09).
        # CR-09: KEIN vorab existierendes dist/assets fuer cp -r — GNU cp kopiert
        # das Quellverzeichnis sonst HINEIN (dist/assets/fonts/fonts/*).
        run: |
          cp manifest.webmanifest dist/manifest.webmanifest
          cp -r icons dist/
          mkdir -p dist/assets
          cp -r assets/fonts dist/assets/
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: production-build
          path: dist/
          retention-days: 7

  smoke-test:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v8
        with:
          name: production-build
          path: dist/
      - name: Starte HTTP-Server
        run: python -m http.server 8000 --directory dist &
        shell: bash
      - name: Warte auf Server
        run: sleep 2
      - name: Smoke-Test
        run: npx playwright test --config=playwright.smoke.config.js
        env:
          SMOKE_BASE_URL: http://localhost:8000/dnd-tracker-optimized.html

  deploy:
    runs-on: ubuntu-latest
    needs: [smoke-test]
    # WR-07: Nur bei Push auf main deployen — sonst würde ein Same-Repo-PR
    # nach grünem Smoke ungemergten Code auf GitHub Pages veröffentlichen
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: python build.py --production
      - name: Bereite Pages-Artefakt vor
        # CR-09: KEIN vorab existierendes Zielverzeichnis fuer cp -r — GNU cp
        # kopiert sonst das Quellverzeichnis HINEIN (dist/assets/fonts/fonts/*)
        # und die SW-Precache-Pfade ./assets/fonts/*.woff2 waeren 404.
        run: |
          cp manifest.webmanifest dist/manifest.webmanifest
          cp -r icons dist/
          mkdir -p dist/assets
          cp -r assets/fonts dist/assets/
        shell: bash
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/
      - uses: actions/deploy-pages@v5
        id: deployment
