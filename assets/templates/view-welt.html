<!-- WELT & STORY VIEWS - Phase 5 (WELT-01..05) -->
<!-- Wave 0: Grundgerüst mit 4 leeren View-Containern -->
<!-- Implementierung: Pläne 05-02 bis 05-07 füllen die Inhalte -->

<!-- SESSION-PREP VIEW (WELT-01) -->
<section id="view-sessionprep" class="view">
    <div class="section-toolbar">
        <div class="section-toolbar-identity">
            <span class="section-toolbar-title">📋 Session-Vorbereitung</span>
            <span class="section-toolbar-count" id="sessionprep-count">0</span>
        </div>
        <div class="section-toolbar-search">
            <div class="search-wrapper">
                <input type="text" id="sessionprep-search" class="toolbar-search" placeholder="🔍 Session-Prep suchen..." data-action="search-input" data-render="renderSessionPrepList">
                <button class="search-clear-btn" data-action="clear-search" data-value="sessionprep-search" title="Suche leeren">✕</button>
            </div>
        </div>
        <div class="section-toolbar-filters">
            <div class="section-toolbar-io">
                <button class="io-btn export" data-action="export-data" data-value="sessionPreps" title="Session-Preps exportieren">📤</button>
                <button class="io-btn import" data-action="trigger-click" data-value="import-sessionPreps" title="Session-Preps importieren">📥</button>
                <input type="file" id="import-sessionPreps" class="io-file-input" accept=".json" data-on-change="import-data" data-type="sessionPreps">
            </div>
        </div>
        <div class="section-toolbar-actions">
            <button class="btn btn-primary" data-action="show-session-prep-modal">+ Neue Session-Prep</button>
        </div>
    </div>
    <div class="wp-view-content" id="sessionprep-content">
        <!-- renderSessionPrepList() befüllt diesen Bereich -->
    </div>
</section>

<!-- KALENDER / TIMELINE VIEW (WELT-03) -->
<section id="view-kalender" class="view">
    <div class="section-toolbar">
        <div class="section-toolbar-identity">
            <span class="section-toolbar-title">📅 Timeline &amp; Kalender</span>
            <span class="section-toolbar-count" id="kalender-count">0</span>
        </div>
        <div class="section-toolbar-search">
            <div class="search-wrapper">
                <input type="text" id="kalender-search" class="toolbar-search" placeholder="🔍 Ereignis suchen..." data-action="search-input" data-render="renderTimeline">
                <button class="search-clear-btn" data-action="clear-search" data-value="kalender-search" title="Suche leeren">✕</button>
            </div>
        </div>
        <div class="section-toolbar-filters">
            <div class="section-toolbar-io">
                <button class="io-btn export" data-action="export-data" data-value="calendarEvents" title="Timeline exportieren">📤</button>
                <button class="io-btn import" data-action="trigger-click" data-value="import-calendarEvents" title="Timeline importieren">📥</button>
                <input type="file" id="import-calendarEvents" class="io-file-input" accept=".json" data-on-change="import-data" data-type="calendarEvents">
            </div>
        </div>
        <div class="section-toolbar-actions">
            <button class="btn btn-primary" data-action="show-timeline-modal">+ Ereignis</button>
        </div>
    </div>
    <div class="tl-kalender-header" id="tl-kalender-header">
        <!-- renderKalender() befüllt diese Zeile mit Harptos-Datum -->
    </div>
    <div class="tl-view-content" id="tl-events-list">
        <!-- renderTimeline() befüllt diesen Bereich -->
    </div>
</section>

<!-- REISE VIEW (WELT-04) -->
<section id="view-reise" class="view">
    <div class="section-toolbar">
        <div class="section-toolbar-identity">
            <span class="section-toolbar-title">&#x1F9ED; Reise &amp; Wetter</span>
        </div>
        <!-- F-09/F-10: bewusst OHNE Zaehler, Suche und Import/Export. Reise ist
             ein Rechner, keine Liste: die Ansicht liest ein Formular, berechnet
             Tagesmaersche und rueckt den Kalender vor (features/reise/reise-crud.js).
             Es gibt kein Datenfeld, das man zaehlen, durchsuchen oder
             exportieren koennte. Ein Zaehler von nichts waere schlechter als
             keiner. -->
    </div>
    <div class="rs-view-content" id="reise-content">
        <!-- renderReise() befüllt diesen Bereich -->
    </div>
</section>
